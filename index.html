<style>

body{margin:0;background:var(--screen);color:var(--ink);font-family:"Newsreader",Georgia,serif;font-size:1.2rem;line-height:1.6}
#stage{position:relative;height:100vh;height:100svh;overflow:hidden;background:var(--night)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#fade{position:absolute;inset:0;background:var(--screen);opacity:0;pointer-events:none}
#hero{position:absolute;left:clamp(1.25rem,6vw,5rem);top:clamp(2.5rem,12vh,8rem);color:#ffe3c4;z-index:2;max-width:22rem;will-change:transform,opacity;text-shadow:0 2px 26px rgba(10,4,20,.85)}

#reviews{max-width:44rem;margin:0 auto;padding:6rem 1.5rem 7rem}
.rev{padding:3rem 0;border-top:1px solid var(--line)}
.rev:first-child{border-top:0}
.rev h2{font:700 clamp(1.8rem,4.5vw,2.7rem)/1.1 "Bricolage Grotesque",Helvetica,Arial,sans-serif;letter-spacing:-.02em;margin:0 0 .6rem}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1.1rem;margin-bottom:1rem;color:var(--muted);font-style:italic}
.stars{font-style:normal;font-size:1.35rem;letter-spacing:.12em;color:var(--star)}
.stars .off{color:var(--star-off)}
.rev p{margin:0;max-width:60ch}
#end{padding-top:3rem;border-top:1px solid var(--line);color:var(--muted);font-style:italic}
</style>
</head>
<body>
<section id="stage" aria-label="Una stanza al neon mentre fuori piove">
<canvas id="gl" aria-hidden="true"></canvas>
<div id="fade"></div>
<div id="hero"><h1>chilling</h1><p>Le recensioni dei film che ho visto. Prendi una coperta, fuori piove.</p></div>
</section>
<main id="reviews"></main>

});

bx(dark,0,.3,-4.5,.7,.6,.7);bx(M(0xcfcfd4,.6),-.9,.2,-4.4,.5,.2,.5);bx(M(0xdadade,.6),-.9,.42,-4.4,.5,.2,.5);

function plant(x,z,s){
  var g=new T.Group(),lm=M(0x2f7a45,.8);
  var pot=new T.Mesh(new T.CylinderGeometry(.18,.14,.32,12),M(0x7a4a34));pot.position.y=.16;g.add(pot);
  for(var i=0;i<11;i++){var y=new T.Group();y.rotation.y=i*.57+rnd();var t=new T.Group();t.position.y=.3;t.rotation.z=.35+rnd()*.9;y.add(t);var lf=new T.Mesh(gS,lm);lf.scale.set(.05,.4+rnd()*.15,.012);lf.position.y=.38;t.add(lf);g.add(y)}
  g.scale.set(s,s,s);g.position.set(x,0,z);scene.add(g);
}

/* neon e poster */

var txt=neonTex(function(g,W,H){g.font="italic 700 150px cursive";g.textAlign="center";g.textBaseline="middle";g.strokeText("chilling",W/2,H/2)},"#ff9a2e");

  ren.render(scene,cam);
}
if(matchMedia("(prefers-reduced-motion:reduce)").matches){frameAt(0,0);return}

gsap.registerPlugin(ScrollTrigger);
if(window.Lenis){var lenis=new Lenis({lerp:.1});lenis.on("scroll",ScrollTrigger.update);gsap.ticker.add(function(t){lenis.raf(t*1000)});gsap.ticker.lagSmoothing(0)}
ScrollTrigger.create({trigger:"#stage",start:"top top",end:"+=3600",pin:true,onUpdate:function(s){target=s.progress}});
(function loop(){cur+=(target-cur)*.08;frameAt(cur,(performance.now()-t0)/1000);requestAnimationFrame(loop)})();
})();
</script>
